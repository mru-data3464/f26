<h2 id="the-problem">The problem</h2>
<ul>
<li data-marpit-fragment="1">As you've seen, real-world data is messy</li>
<li data-marpit-fragment="2">Missing values are common, other values don't make sense</li>
<li data-marpit-fragment="3">We need to decide how to deal with these problems</li>
</ul>
<div data-marpit-fragment>
<blockquote>
<p>What examples have we seen so far?<br />
Why might data be missing or weird*?</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="5" data-paginate="true" data-class="code_reminder" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" class="code_reminder" data-marpit-pagination="5" style="--paginate:true;--class:code_reminder;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="missing-data">Missing data</h2>

<p>When data are missing in the <em>features</em> we have a few options:</p>
<ol start="0">
<li data-marpit-fragment="1">Do nothing! Some algorithms (e.g. <a href="https://scikit-learn.org/stable/modules/tree.html#tree-missing-value-support">Decisions Trees</a>) can handle missing values</li>
<li data-marpit-fragment="2">Remove <em>features</em> with missing values</li>
<li data-marpit-fragment="3">Remove <em>samples</em> with missing values</li>
<li data-marpit-fragment="4">Invent a new value to represent &quot;missingness&quot;</li>
<li data-marpit-fragment="5"><strong>Impute</strong> a value based on other data</li>
</ol>
<div data-marpit-fragment>
<blockquote>
<p>Most important: understand <em>why</em> data are missing (more EDA!)</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-fragments="2" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="6" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="option-1-removing-features">Option 1: removing features</h2>
<ul>
<li data-marpit-fragment="1">If a feature has:
<ul>
<li>A high proportion of missing values, <em>and</em></li>
<li>Little apparent relationship to the target <em>or</em></li>
<li>its information is redundant with other features</li>
</ul>
</li>
<li data-marpit-fragment="2">It may be reasonable to remove it entirely. You can drop it, e.g.:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">df.drop(columns=[<span class="hljs-string">&#x27;feature_name&#x27;</span>], inplace=<span class="hljs-literal">True</span>)
</code></pre>
or (probably more reliable) just not select it when building your pipeline</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="3" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="7" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="option-2-removing-samples">Option 2: removing samples</h2>
<ul>
<li data-marpit-fragment="1">If:
<ul>
<li>Only a small number of samples have missing values</li>
<li>The values are missing completely at random<br />
Then you can drop them <strong>from the training data</strong>:<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">train_nona = train.dropna(subset=[[<span class="hljs-string">&quot;features&quot;</span>,<span class="hljs-string">&quot;we&quot;</span>,<span class="hljs-string">&quot;care&quot;</span>,<span class="hljs-string">&quot;about&quot;</span>]])
</code></pre>
</li>
</ul>
</li>
<li data-marpit-fragment="2">Good idea if the same samples have missing values from multiple features</li>
<li data-marpit-fragment="3">Still useful to explore <em>why</em> data are missing</li>
</ul>
<div data-marpit-fragment>
<blockquote>
<p>What does this imply at inference time?</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="3" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="8" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="option-3-invent-a-new-value">Option 3: invent a new value</h2>
<ul>
<li data-marpit-fragment="1">Categorical features: add a new category for &quot;missing&quot;</li>
<li data-marpit-fragment="2">Add a new binary feature indicating whether the value was missing</li>
<li data-marpit-fragment="3">I have seen advice to use extreme values for numerical features, like the -1 income in the OKCupid dataset, but I'm not convinced this is a good idea</li>
</ul>
<div data-marpit-fragment>
<blockquote>
<p><a href="https://feat.engineering/08-Handling_Missing_Data.html#encoding-missingness">Case study</a>: where missingness is informative</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="5" data-paginate="true" data-class="code_reminder" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" class="code_reminder" data-marpit-pagination="9" style="--paginate:true;--class:code_reminder;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="option-4-impute-missing-values">Option 4: impute missing values</h2>

<ul>
<li data-marpit-fragment="1">Fill in the missing values with an &quot;educated guess&quot;</li>
<li data-marpit-fragment="2">Replace missing value with:
<ul>
<li>constant</li>
<li>mean, median, or mode (<code>most_frequent</code>)</li>
</ul>
</li>
<li data-marpit-fragment="3">Use other features to infer missing value:
<ul>
<li>K-nearest neighbours</li>
<li>simple models to predict missing values</li>
</ul>
</li>
<li data-marpit-fragment="4">Can be combined with option 3 to <a href="https://scikit-learn.org/stable/modules/impute.html#marking-imputed-values">indicate missing features</a></li>
<li data-marpit-fragment="5">How much to impute? <a href="https://feat.engineering/08-Handling_Missing_Data.html#sec-imputation-methods">Feat.Engineering</a> suggests no more than 20%</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="10" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="choosing-an-imputation-strategy">Choosing an imputation strategy</h2>
<table>
<thead>
<tr>
<th>Strategy</th>
<th>When to use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Constant</td>
<td>When there is a reasonable default value</td>
</tr>
<tr>
<td>Mean</td>
<td>Numeric features with normal distribution</td>
</tr>
<tr>
<td>Median</td>
<td>Numeric features with extreme outliers</td>
</tr>
<tr>
<td>KNN</td>
<td>Relationship with other features</td>
</tr>
<tr>
<td>Missingness indicator</td>
<td>If missingness seems informative</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="3" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="11" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="outliers">Outliers</h2>
<blockquote>
<p>An outlier is an observation which deviates so much from the other observations as to arouse suspicions that it was generated by a different mechanism. — D. M. Hawkins</p>
</blockquote>
<ul>
<li data-marpit-fragment="1">There are many entire books dedicated to outlier detection</li>
<li data-marpit-fragment="2">Useful for anomaly detection, e.g:
<ul>
<li>fraud detection</li>
<li>failure prediction</li>
<li><a href="https://en.wikipedia.org/wiki/Anomaly_detection#Applications">Many other applications</a></li>
</ul>
</li>
<li data-marpit-fragment="3">Our focus is on dealing with outliers in preprocessing</li>
</ul>
<footer><a href="https://link.springer.com/chapter/10.1007/978-94-015-3994-4_1">Hawkins, D. M. (1980). Identification of Outliers.</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="4" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="12" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../img/06-income-hist.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="13" data-marpit-fragments="4" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="12" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="detecting-outliers">Detecting outliers</h2>

<ul>
<li data-marpit-fragment="1">Visually as part of EDA</li>
<li data-marpit-fragment="2">Statistically, e.g. <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.09ex;" xmlns="http://www.w3.org/2000/svg" width="4.812ex" height="1.595ex" role="img" focusable="false" viewBox="0 -665 2126.8 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="3E" d="M84 520Q84 528 88 533T96 539L99 540Q106 540 253 471T544 334L687 265Q694 260 694 250T687 235Q685 233 395 96L107 -40H101Q83 -38 83 -20Q83 -19 83 -17Q82 -10 98 -1Q117 9 248 71Q326 108 378 132L626 250L378 368Q90 504 86 509Q84 513 84 520Z"></path></g><g data-mml-node="mn" transform="translate(1055.8,0)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g><g data-mml-node="mi" transform="translate(1555.8,0)"><path data-c="1D70E" d="M184 -11Q116 -11 74 34T31 147Q31 247 104 333T274 430Q275 431 414 431H552Q553 430 555 429T559 427T562 425T565 422T567 420T569 416T570 412T571 407T572 401Q572 357 507 357Q500 357 490 357T476 358H416L421 348Q439 310 439 263Q439 153 359 71T184 -11ZM361 278Q361 358 276 358Q152 358 115 184Q114 180 114 178Q106 141 106 117Q106 67 131 47T188 26Q242 26 287 73Q316 103 334 153T356 233T361 278Z"></path></g></g></g></svg></mjx-container></li>
<li data-marpit-fragment="3">Algorithmically, e.g. <a href="https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html">Isolation Forests</a></li>
<li data-marpit-fragment="4">As usual, context and domain knowledge are essential</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="4" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="12" style="" data-marpit-pagination-total="24" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="13" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../img/06-income-boxplot.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="14" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="13" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="context-matters">Context matters!</h2>
<p>Look at the relationship between outliers and target (training dataset, of course)</p>
<blockquote>
<p>What do the dots on <a href="https://matplotlib.org/stable/api/_as_gen/matplotlib.pyplot.boxplot.html">box plots</a> represent?</p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="13" style="" data-marpit-pagination-total="24" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="code_reminder" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" class="code_reminder" data-marpit-pagination="14" style="--paginate:true;--class:code_reminder;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="be-careful-with-visual-inspection">Be careful with visual inspection</h2>
<div class="columns">
<p><img src="../img/06-income-boxplot.png" alt="" /></p>
<p><img src="../img/06-income-boxplot-jitter.png" alt="" /></p>
</div>
<blockquote>
<p>11% of samples are &quot;outliers&quot;!</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-fragments="4" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="15" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="what-to-do-about-outliers">What to do about outliers?</h2>
<p>As usual, very data- and model-dependent. Tree based methods are particularly impacted by outliers!</p>
<ol>
<li data-marpit-fragment="1">Data transformations</li>
<li data-marpit-fragment="2">Drop the samples</li>
<li data-marpit-fragment="3">Encode them somehow</li>
<li data-marpit-fragment="4">Leave them alone</li>
</ol>
<div data-marpit-fragment>
<blockquote>
<p>Any other ideas?</p>
</blockquote>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="2" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="16" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../img/06-income-hist-log.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720" x="50%"><section id="17" data-marpit-fragments="2" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="16" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="24" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h2 id="nonlinear-transformations">Nonlinear transformations</h2>

<ul>
<li data-marpit-fragment="1">Transforming the data does not actually remove the outlier</li>
<li data-marpit-fragment="2">Can help make the relationship less extreme for linear models</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="2" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="16" style="" data-marpit-pagination-total="24" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="4" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="17" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="dropping-the-samples">Dropping the samples</h2>
<ul>
<li data-marpit-fragment="1">In general, not a thing I love to do</li>
<li data-marpit-fragment="2">If you drop a sample from training, you need to decide what to do at inference</li>
<li data-marpit-fragment="3">My opinion: Only do it if you're confident it's an error in the dataset
<blockquote>
<p>Can you think of an example we've seen so far?</p>
</blockquote>
</li>
<li data-marpit-fragment="4">What can you do at inference time when outliers are encountered?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-fragments="5" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="18" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="encoding-outliers">Encoding outliers</h2>
<p>A few other options that might fall into &quot;encoding&quot;:</p>
<ul>
<li data-marpit-fragment="1">Just like with missing values, binary column indicating outlier/inlier</li>
<li data-marpit-fragment="2">Remove the values and convert them to missing</li>
<li data-marpit-fragment="3">Bin or impose a cap (floor/ceiling) on the value</li>
<li data-marpit-fragment="4">Replace the numeric value with a rank or quantile bucket</li>
<li data-marpit-fragment="5">Probably other things!</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="19" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="leave-them-alone">Leave them alone</h2>
<p>If your outliers are:</p>
<ul>
<li>Real values (not data entry or other errors)</li>
<li>Representative of things that might happen during inference</li>
</ul>
<p>Then you probably want to keep them!</p>
<blockquote>
<p>Consider using a <a href="https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.RobustScaler.html#sklearn.preprocessing.RobustScaler">RobustScalar</a> to standardize if you have lots of outliers</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="4" data-paginate="true" data-heading-divider="2" data-theme="jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay" lang="C" data-marpit-pagination="20" style="--paginate:true;--heading-divider:2;--theme:jp6nryrzrpekr3ghmt486g40lk602mwsyla3mumbaay;" data-marpit-pagination-total="24">
<h2 id="missing-values-and-outliers-in-the-target">Missing values and outliers in the target</h2>
<ul>
<li data-marpit-fragment="1">If you have missing values in the target, you probably want to avoid imputing</li>
<li data-marpit-fragment="2">This is a good case for dropping samples from <strong>training</strong>!</li>
<li data-marpit-fragment="3">Outliers are trickier — again, check if they're real or mistakes</li>
